<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Icon Example</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Full screen loader */
        #loader {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        /* Hide the content until page is fully loaded */
        #content {
            display: none;
        }
    </style>
</head>
<body>

<!-- Loader (Spinner) -->
<div id="loader">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<!-- Your content -->
<div id="content" class="container mt-5">
    <h1>Welcome to My Page</h1>
    <p>This content will show after the loading spinner disappears.</p>
</div>

<!-- Bootstrap JS (optional, for extra features) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom Script to hide loader and show content -->
<script>
    // Wait for the whole page to load
    window.onload = function() {
        // Hide the loader
        document.getElementById('loader').style.display = 'none';
        // Show the content
        document.getElementById('content').style.display = 'block';
    };
</script>

</body>
</html>
